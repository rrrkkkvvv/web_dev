<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <link rel="stylesheet" href="public/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    </head>
    <body class=" bg-black d-flex justify-content-center ">
        <div id="app" class=" bg-white p-12 dvh-100">
            <h1>Co masz dzisiaj zrobić?</h1>
         
            <label for="todoInput">Dodaj zadanie</label>
            <input type="text" id="todoInputField"/>
         

            <button type="button" id="todoAddButton" class="w-max btn-solid theme-success" >Dodaj zadanie</button>

            <div id="todoContainer"></div>
    

        </div>
 
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

        <script src="public/main.js" defer></script>
    </body>
</html>
